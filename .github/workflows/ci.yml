name: MultiAI CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore MultiAI.slnx

    - name: Build Solution (x64)
      run: dotnet build MultiAI.slnx --configuration Release -p:Platform=x64 --no-restore

    - name: Run xUnit Unit Tests (x64)
      run: dotnet test MultiAI.Tests/MultiAI.Tests.csproj --configuration Release -p:Platform=x64 --no-build --verbosity normal
